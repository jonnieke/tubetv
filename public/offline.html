<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - TubeTV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: #a1a1aa;
      font-size: 15px;
      line-height: 1.5;
      max-width: 420px;
      margin-bottom: 28px;
    }
    .retry-btn {
      background: #dc2626;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #b91c1c;
    }
    .logo {
      font-weight: 900;
      font-size: 18px;
      margin-top: 48px;
      color: #71717a;
    }
    .logo span {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="badge">
    <div class="badge-dot"></div>
    No Internet Connection
  </div>
  <h1>You're currently offline</h1>
  <p>Check your Safaricom or Airtel data connection. Once you're back online, TubeTV will automatically reconnect your drama stream.</p>
  <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
  <div class="logo">Tube<span>TV</span> Kenya</div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
