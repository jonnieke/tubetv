name: Ops Health Check & Payment Reconciliation (Every 30m)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ops-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Run Live Health Check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.OPS_CRON_SECRET || secrets.NOTIFY_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SUPABASE_URL or CRON_SECRET is not configured; skipping."
            exit 0
          fi
          curl -fsS -X POST "${SUPABASE_URL}/functions/v1/ops-monitor" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{"action":"health_check"}'

      - name: Reconcile Stuck Paystack / M-Pesa Payments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.OPS_CRON_SECRET || secrets.NOTIFY_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            exit 0
          fi
          curl -fsS -X POST "${SUPABASE_URL}/functions/v1/ops-monitor" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{"action":"reconcile_payments"}'
