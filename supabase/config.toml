
[functions.send-push]
enabled = true
verify_jwt = true
import_map = "./functions/send-push/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-push/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-push/*.html" ]

[functions.mpesa-stk-push]
enabled = true
verify_jwt = true
entrypoint = "./functions/mpesa-stk-push/index.ts"

[functions.mpesa-callback]
enabled = true
verify_jwt = false
entrypoint = "./functions/mpesa-callback/index.ts"

[functions.account-data]
enabled = true
verify_jwt = true
entrypoint = "./functions/account-data/index.ts"

[functions.analytics-event]
enabled = true
verify_jwt = false
entrypoint = "./functions/analytics-event/index.ts"

[functions.content-visibility]
enabled = true
verify_jwt = true
entrypoint = "./functions/content-visibility/index.ts"
