    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Primary SEO -->
    <title>Tube TV — Watch Kenyan Videos, News, Comedy &amp; Education</title>
    <meta name="description" content="Kenya's home for original content, education, farming, faith and live streams. Watch comedy, drama, KCSE revision, farming tips and more. 100% Made in Kenya." />
    <meta name="keywords" content="Kenya videos, Kenyan content, Tube TV, online TV Kenya, Kenyan comedy, KCSE revision, Kenyan series, Nairobi, farming Kenya" />
    <meta name="author" content="Tube TV" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#dc2626" />
    <link rel="canonical" href="https://tubekenya.co.ke" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tubekenya.co.ke" />
    <meta property="og:title" content="Tube TV — Watch Kenyan Videos Online" />
    <meta property="og:description" content="Kenya's home for original content, education, farming, faith and live streams. 100% Made in Kenya." />

    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:site_name" content="Tube TV" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TubeKenya" />
    <meta name="twitter:title" content="Tube TV — Watch Kenyan Videos Online" />
    <meta name="twitter:description" content="Kenya's home for original content, education, farming, faith and live streams. 100% Made in Kenya." />
    <meta name="twitter:image" content="https://tubekenya.co.ke/og-image.png" />

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tube TV" />

    <!-- Performance: preconnect to external origins used at startup -->
    <link rel="preconnect" href="https://aistudiocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://aistudiocdn.com" />

    <link rel="dns-prefetch" href="https://vz-0fe79b1a-8ad.b-cdn.net" />
    <link rel="dns-prefetch" href="https://b-cdn.net" />
    <!-- Google AI / Gemini -->
    <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com" />
    <!-- Supabase realtime + auth -->
    <link rel="preconnect" href="https://supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://supabase.co" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Structured data: Organization + WebSite + FAQ (AIO/rich-results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://tubekenya.co.ke/#organization",
          "name": "Tube TV",
          "url": "https://tubekenya.co.ke",
          "logo": {
            "@type": "ImageObject",
            "url": "https://tubekenya.co.ke/og-image.png",
            "width": 1200,
            "height": 630
          },
          "description": "Kenya's home for original video content, education, farming tips, faith, and live streams.",
          "sameAs": ["https://twitter.com/TubeKenya"],
          "areaServed": "KE",
          "knowsAbout": ["Kenyan entertainment","KCSE revision","farming in Kenya","Kenyan comedy","Kenyan series","CBC curriculum","Kiswahili content"]
        },
        {
          "@type": "WebSite",
          "@id": "https://tubekenya.co.ke/#website",
          "url": "https://tubekenya.co.ke",
          "name": "Tube TV",
          "description": "Kenya's home for original content, education, farming, faith and live streams.",
          "publisher": { "@id": "https://tubekenya.co.ke/#organization" },
          "inLanguage": "en-KE",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://tubekenya.co.ke/?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Tube TV Kenya?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Tube TV is Kenya's premier online streaming platform offering original Kenyan content including comedy, drama, KCSE and CBC revision, farming tips, faith content, and live streams — 100% Made in Kenya."
              }
            },
            {
              "@type": "Question",
              "name": "Is Tube TV free to watch?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Tube TV offers free content for all registered users. Ndovu (premium) subscribers unlock exclusive originals and an ad-free experience."
              }
            },
            {
              "@type": "Question",
              "name": "Can I watch Tube TV on my phone?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Tube TV is fully mobile-optimised and can be installed as a PWA app on Android or iPhone for offline access and push notifications — no app store needed."
              }
            },
            {
              "@type": "Question",
              "name": "Does Tube TV have educational content for KCSE and CBC?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Tube TV has a dedicated Education section with KCSE revision videos, CBC curriculum content, and subject-specific tutorials for Kenyan students."
              }
            }
          ]
        }
      ]
    }
    </script>
